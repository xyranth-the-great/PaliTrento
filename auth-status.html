<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account Status Check | PaliTrento</title>
<meta name="description" content="Verifying your account status...">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .auth-status-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--pad); }
  .auth-status-card { width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 40px; text-align: center; }
  .auth-status-icon { width: 80px; height: 80px; margin: 0 auto 24px; background: var(--muted-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--primary); }
  .auth-status-icon svg { width: 40px; height: 40px; }
  .auth-status-title { font-size: 1.5rem; color: var(--primary-dark); margin: 0 0 8px; }
  .auth-status-subtitle { color: var(--muted); margin: 0 0 32px; }
  .auth-status-details { background: var(--muted-bg); border-radius: var(--r-lg); padding: 20px; margin-bottom: 24px; text-align: left; }
  .auth-status-actions { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .auth-status-actions a:not(.btn) { color: var(--primary); }
  .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .detail-row:last-child { border-bottom: none; }
  .detail-label { color: var(--muted); font-size: 0.9rem; }
  .detail-value { font-weight: 600; color: var(--ink); text-align: right; max-width: 60%; word-break: break-word; }
  .spinner { width: 40px; height: 40px; margin: 0 auto 16px; border: 4px solid var(--line); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 480px) {
    .auth-status-card { padding: 24px; }
    .auth-status-title { font-size: 1.25rem; }
    .detail-row { flex-direction: column; align-items: flex-start; gap: 4px; }
    .detail-value { text-align: left; max-width: 100%; }
  }
</style>
</head>
<body>
<div id="chrome-top"></div>
<main class="auth-status-page">
  <div class="auth-status-card" role="status" aria-live="polite">
    <div class="auth-status-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spinner">
        <circle cx="12" cy="12" r="10"></circle>
      </svg>
    </div>
    <h1 class="auth-status-title" id="auth-status-title">Verifying Account Status</h1>
    <p class="auth-status-subtitle" id="auth-status-subtitle">Please wait while we check your account status...</p>

    <div class="auth-status-details" id="status-details" style="display:none">
      <div class="detail-row">
        <span class="detail-label">Account Status</span>
        <span class="detail-value" id="status-value">—</span>
      </div>
      <div class="detail-row" id="suspended-row" style="display:none">
        <span class="detail-label">Suspended Until</span>
        <span class="detail-value" id="suspended-until">—</span>
      </div>
      <div class="detail-row" id="banned-row" style="display:none">
        <span class="detail-label">Banned On</span>
        <span class="detail-value" id="banned-at">—</span>
      </div>
      <div class="detail-row" id="reason-row" style="display:none">
        <span class="detail-label">Reason</span>
        <span class="detail-value" id="status-reason">—</span>
      </div>
    </div>

    <p class="auth-status-subtitle" id="redirect-message" style="display:none"></p>
    <div class="auth-status-actions" id="status-actions" style="display:none">
      <a class="btn alt" href="/login/">Return to login</a>
      <a href="mailto:admin@palitrento.online">Contact support</a>
    </div>
  </div>
</main>
<div id="chrome-foot"></div>
<script type="module">
import { renderChrome, $, esc } from './js/ui.js';
import { supabase } from './js/supabase.js';

function formatDate(date) {
  return date.toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' });
}

// Get email from URL params
function getEmailFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('email')?.toLowerCase();
}

function getStatusDetailsFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const status = params.get('status');
  return {
    status: ['suspended', 'banned', 'restricted'].includes(status) ? 'restricted' : null,
    until: params.get('until'),
    reason: params.get('reason'),
    since: params.get('since')
  };
}

async function checkProfileByEmail(email) {
  console.log('[auth-status] Checking profile for email:', email);
  const statusDetails = getStatusDetailsFromUrl();

  try {
    const { data: profile, error } = await supabase
      .from('profiles')
      .select('id, account_status, suspended_until, suspension_reason, suspended_at, banned_at, ban_reason, email')
      .eq('email', email)
      .maybeSingle();

    if (error) {
      console.error('[auth-status] Profile query failed:', error);
      if (statusDetails.status) {
        showRestrictedStatus(statusDetails.status, null, statusDetails, 'The sign-in check found a restricted account, but account details could not be loaded.');
        return;
      }
      showError('Failed to verify account. Please try again.');
      return;
    }

    if (!profile) {
      console.warn('[auth-status] Profile not found for email:', email);
      if (statusDetails.status) {
        showRestrictedStatus(statusDetails.status, null, statusDetails, 'The sign-in check found a restricted account, but account details could not be loaded.');
        return;
      }
      showError('Account not found. Please contact support.');
      return;
    }

    console.log('[auth-status] Profile found:', profile);
    console.log('[auth-status] Current time:', new Date().toISOString());
    console.log('[auth-status] Suspended until:', profile.suspended_until);
    console.log('[auth-status] Account status:', profile.account_status);
    showStatus(profile, statusDetails.status, statusDetails);

    const now = Date.now();

    if (profile.account_status === 'active' && statusDetails.status) {
      showPersistentMessage(
        'Your account access is restricted',
        'Your profile is marked active, but sign-in was blocked. The sign-in error does not confirm whether your account is suspended or permanently banned. Please contact support to verify your account status.'
      );
      return;
    }

    if (profile.account_status === 'banned') {
      showPersistentMessage(
        'Your account is banned',
        'This account is banned and cannot sign in. Review the details below or contact support if you believe this is a mistake.'
      );
      return;
    }

    if (profile.account_status === 'suspended') {
      if (profile.suspended_until && new Date(profile.suspended_until).getTime() <= now) {
        // Suspension expired - trigger auto-restore
        console.log('[auth-status] Suspension expired, triggering auto-restore...');
        showChecking('Suspension expired. Restoring access...');
        const { error: restoreError } = await supabase.rpc('auto_restore_expired_suspensions');
        if (restoreError) {
          console.warn('[auth-status] Auto-restore failed:', restoreError);
          showError('Your suspension period has expired, but access could not be restored automatically. Please contact support.');
          return;
        }
        showPersistentMessage(
          'Suspension period ended',
          'Your suspension period has ended. Please try signing in again. Contact support if you still cannot access your account.'
        );
        return;
      }
      showPersistentMessage(
        'Your account is suspended',
        'This account is temporarily suspended and cannot sign in until the date shown below. Contact support if you believe this is a mistake.'
      );
      return;
    }

    // Active account - check moderation actions for debugging
    console.log('[auth-status] Account is active, checking moderation history...');
    try {
      const { data: actions } = await supabase
        .from('account_moderation_actions')
        .select('action, reason, created_at, expires_at')
        .eq('target_user_id', profile.id)
        .order('created_at', { ascending: false })
        .limit(5);
      console.log('[auth-status] Recent moderation actions:', actions);
    } catch (e) {
      console.warn('[auth-status] Could not fetch moderation actions:', e);
    }

    showPersistentMessage(
      'Sign-in needs attention',
      profile.account_status === 'active'
        ? 'Your account is marked active, but sign-in was blocked. Please return to login or contact support for help.'
        : 'We could not confirm your account status. Please return to login or contact support for help.'
    );

  } catch (err) {
    console.error('[auth-status] Exception:', err);
    showError('An error occurred. Please try again.');
  }
}

function showRestrictedStatus(status, profile, statusDetails, message) {
  showStatus(profile || {}, status, statusDetails);
  showPersistentMessage(
    'Your account access is restricted',
    message
  );
}

async function checkProfileBySession() {
  console.log('[auth-status] Checking session...');

  if (!supabase) {
    showError('Service unavailable. Please try again later.');
    return;
  }

  const { data: { session }, error: sessionError } = await supabase.auth.getSession();

  if (sessionError) {
    console.error('[auth-status] Session error:', sessionError);
    showError('We could not verify your account status. Please return to login or contact support.');
    return;
  }

  if (!session) {
    console.log('[auth-status] No active session');
    showError('Sign-in was blocked, but we could not identify the account. Please return to login or contact support.');
    return;
  }

  const sessionEmail = session.user.email?.toLowerCase();
  if (!sessionEmail) {
    console.error('[auth-status] No email in session');
    showError('We could not identify the account to verify its status. Please contact support.');
    return;
  }

  console.log('[auth-status] Session found for:', sessionEmail);
  await checkProfileByEmail(sessionEmail);
}

function showStatus(profile, statusHint = null, statusDetails = {}) {
  const status = profile.account_status || statusHint;
  $('#status-details').style.display = 'block';
  $('#status-value').textContent = status?.charAt(0).toUpperCase() + status?.slice(1) || 'Unknown';

  if (status === 'suspended') {
    $('#suspended-row').style.display = 'flex';
    const suspendedUntil = profile.suspended_until || statusDetails.until;
    $('#suspended-until').textContent = suspendedUntil
      ? formatDate(new Date(suspendedUntil))
      : profile.account_status === 'suspended' ? 'Permanent' : 'Unavailable';
    const suspensionReason = profile.suspension_reason || statusDetails.reason;
    if (suspensionReason || profile.account_status !== 'suspended') {
      $('#reason-row').style.display = 'flex';
      $('#status-reason').textContent = suspensionReason || 'Not available';
    }
  } else if (status === 'banned') {
    $('#banned-row').style.display = 'flex';
    const bannedAt = profile.banned_at || statusDetails.since;
    $('#banned-at').textContent = bannedAt ? formatDate(new Date(bannedAt)) : 'Unknown';
    const banReason = profile.ban_reason || statusDetails.reason;
    if (banReason || profile.account_status !== 'banned') {
      $('#reason-row').style.display = 'flex';
      $('#status-reason').textContent = banReason || 'Not available';
    }
  }
}

function showChecking(message) {
  $('#redirect-message').style.display = 'block';
  $('#redirect-message').textContent = message;
  const icon = document.querySelector('.auth-status-icon');
  if (icon) {
    icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spinner"><circle cx="12" cy="12" r="10"></circle></svg>';
  }
}

function showPersistentMessage(title, message) {
  $('#auth-status-title').textContent = title;
  $('#auth-status-subtitle').style.display = 'none';
  $('#redirect-message').style.display = 'block';
  $('#redirect-message').textContent = message;
  $('#status-actions').style.display = 'flex';
  const icon = document.querySelector('.auth-status-icon');
  if (icon) {
    icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
  }
}

function showError(message) {
  $('#status-details').style.display = 'none';
  $('#auth-status-title').textContent = 'Unable to verify account status';
  $('#auth-status-subtitle').style.display = 'none';
  $('#redirect-message').style.display = 'block';
  $('#redirect-message').textContent = message;
  $('#status-actions').style.display = 'flex';
  const icon = document.querySelector('.auth-status-icon');
  if (icon) {
    icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--bad)"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';
  }
}

async function init() {
  // Render chrome without session (public page)
  renderChrome('/', null, null);

  // PRIORITY 1: Check URL param first (for login redirect flow)
  const urlEmail = getEmailFromUrl();
  if (urlEmail) {
    console.log('[auth-status] Email from URL param:', urlEmail);
    await checkProfileByEmail(urlEmail);
    return;
  }

  const statusDetails = getStatusDetailsFromUrl();
  if (statusDetails.status) {
    showRestrictedStatus(
      statusDetails.status,
      null,
      statusDetails,
      'The sign-in check found a restricted account, but we could not identify it to load more details.'
    );
    return;
  }

  // PRIORITY 2: Check session (for protected page redirects)
  console.log('[auth-status] No URL email, checking session...');
  await checkProfileBySession();
}

init();
</script>
</body>
</html>
