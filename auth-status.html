<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checking Account Status | PaliTrento</title>
<meta name="description" content="Verifying your account status...">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .status-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--pad); }
  .status-card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 40px; text-align: center; }
  .status-spinner { width: 48px; height: 48px; margin: 0 auto 24px; border: 4px solid var(--line); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-title { font-size: 1.25rem; color: var(--primary-dark); margin: 0 0 8px; }
  .status-message { color: var(--muted); font-size: 0.95rem; }
  .status-debug { color: var(--muted); font-size: 0.75rem; margin-top: 16px; font-family: monospace; text-align: left; }
  @media (max-width: 480px) {
    .status-card { padding: 24px; }
    .status-title { font-size: 1.1rem; }
  }
</style>
</head>
<body>
<div id="chrome-top"></div>
<main class="status-page">
  <div class="status-card" role="status" aria-live="polite">
    <div class="status-spinner" aria-hidden="true"></div>
    <h1 class="status-title">Checking Account Status</h1>
    <p class="status-message">Please wait while we verify your account...</p>
    <div class="status-debug" id="debug-log"></div>
  </div>
</main>
<div id="chrome-foot"></div>
<script type="module">
import { renderChrome, $, esc } from './js/ui.js';
import { supabase } from './js/supabase.js';

function logDebug(msg) {
  console.log('[auth-status]', msg);
  const el = $('#debug-log');
  if (el) el.textContent += '\n' + new Date().toLocaleTimeString() + ' ' + msg;
}

function getEmailFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get('email')?.toLowerCase();
}

async function checkAccountStatus() {
  const email = getEmailFromUrl();
  logDebug('Email from URL: ' + (email || 'none'));

  if (!email) {
    logDebug('ERROR: No email parameter provided');
    window.location.href = '/login/';
    return;
  }

  if (!supabase) {
    logDebug('ERROR: Supabase not configured');
    window.location.href = '/login/';
    return;
  }

  logDebug('Supabase client available, querying profiles...');

  try {
    // Fetch profile by email (profiles table now has email column)
    logDebug('Querying profiles table for email: ' + email);
    const { data: profile, error } = await supabase
      .from('profiles')
      .select('account_status, suspended_until, suspension_reason, suspended_at, banned_at, ban_reason, email')
      .eq('email', email)
      .maybeSingle();

    logDebug('Query result - error: ' + (error?.message || 'none') + ', profile: ' + (profile ? 'found' : 'null'));

    if (error) {
      logDebug('ERROR: Profile query failed: ' + error.message);
      // Don't redirect to login on query error - show error state
      return;
    }

    if (!profile) {
      logDebug('Profile not found for email: ' + email);
      // Profile not found - might be a new user or email not synced yet
      window.location.href = '/login/';
      return;
    }

    logDebug('Profile found: account_status=' + profile.account_status + ', suspended_until=' + (profile.suspended_until || 'null'));

    // Check actual account status in database
    const now = Date.now();

    if (profile.account_status === 'banned') {
      logDebug('Account is BANNED, redirecting to /banned/');
      window.location.replace('/banned/?email=' + encodeURIComponent(email));
      return;
    }

    if (profile.account_status === 'suspended') {
      // Check if suspension expired
      if (profile.suspended_until && new Date(profile.suspended_until).getTime() <= now) {
        logDebug('Suspension expired, triggering auto-restore...');
        try {
          await supabase.rpc('auto_restore_expired_suspensions');
          logDebug('Auto-restore called, reloading...');
        } catch (e) {
          logDebug('Auto-restore failed: ' + e);
        }
        window.location.reload();
        return;
      }
      logDebug('Account is SUSPENDED, redirecting to /suspended/');
      window.location.replace('/suspended/?email=' + encodeURIComponent(email));
      return;
    }

    // Account is active - redirect to login (normal flow)
    logDebug('Account is ACTIVE, redirecting to /login/');
    window.location.href = '/login/';
  } catch (err) {
    logDebug('EXCEPTION: ' + err);
    console.error('Auth status check error:', err);
    // Don't redirect on exception - let user see error
  }
}

// Render minimal chrome
renderChrome('/', null, null);

// Start checking
logDebug('Starting auth status check...');
checkAccountStatus();
</script>
</body>
</html>
