<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot password | PaliTrento</title>
<meta name="description" content="Reset your PaliTrento account password.">
<link rel="icon" type="image/png" href="./assets/logo-D8o8arRF.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
  <script type="module" crossorigin src="./assets/forgot-password-C9bXxMn6.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/auth-DXDSwYss.js">
  <link rel="modulepreload" crossorigin href="./assets/ui-BUvbi_9T.js">
  <link rel="stylesheet" crossorigin href="./assets/auth-0UkAEiAn.css">
</head>
<body>
<div id="chrome-top"></div>
<main>
<div class="wrap" style="max-width:480px;padding-top:48px;padding-bottom:48px">
  <h1>Forgot password</h1>
  <p class="muted">Enter your email and we'll send you a link to reset your password.</p>

  <form id="forgot-form" novalidate style="margin-top:24px;display:grid;gap:16px">
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="juan@example.com">
    </div>

    <button type="submit" class="btn" style="width:100%">Send reset link</button>
  </form>

  <p id="forgot-message" class="muted" style="margin-top:16px;min-height:1.5em"></p>

  <p class="muted" style="margin-top:24px">
    Remember your password? <a href="login.html">Log in</a>
  </p>

  <p class="muted" style="margin-top:12px">
    Don't have an account? <a href="register.html">Register</a>
  </p>

  <p class="muted" style="margin-top:16px">
    <a href="explore.html">Explore instead</a>
  </p>
</div>
</main>
<div id="chrome-foot"></div>
</body>
</html>
