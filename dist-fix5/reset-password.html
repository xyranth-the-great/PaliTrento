<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password | PaliTrento</title>
<meta name="description" content="Set a new password for your PaliTrento account.">
<link rel="icon" type="image/png" href="./assets/logo-D8o8arRF.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
  <script type="module" crossorigin src="./assets/reset-password-BB5DKhkh.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/auth-DXDSwYss.js">
  <link rel="modulepreload" crossorigin href="./assets/ui-BUvbi_9T.js">
  <link rel="stylesheet" crossorigin href="./assets/auth-0UkAEiAn.css">
</head>
<body>
<main>
<div class="wrap" style="max-width:480px;padding-top:48px;padding-bottom:48px">
  <h1>Reset password</h1>
  <p class="muted">Enter your new password below.</p>

  <form id="reset-form" novalidate style="margin-top:24px;display:grid;gap:16px">
    <div>
      <label for="password">New password</label>
      <input id="password" name="password" type="password" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters">
      <p class="muted" style="margin-top:4px">Minimum 8 characters</p>
    </div>

    <div>
      <label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password" placeholder="Re-enter password">
    </div>

    <button type="submit" class="btn" style="width:100%">Update password</button>
  </form>

  <p id="reset-message" class="muted" style="margin-top:16px;min-height:1.5em"></p>

  <p class="muted" style="margin-top:24px">
    <a href="login.html">Back to log in</a>
  </p>
</div>
</main>
</body>
</html>
