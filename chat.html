<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
(function () {
  var d = document.documentElement;
  var mode = 'quick';
  try {
    if (!sessionStorage.getItem('pt-splash-seen')) {
      sessionStorage.setItem('pt-splash-seen', '1');
      mode = 'full';
    }
  } catch (e) {}
  d.setAttribute('data-splash', mode);
  d.classList.add('pt-splash-active');
})();
</script>
<style>
.pt-splash{position:fixed;inset:0;z-index:99999;display:grid;place-content:center;justify-items:center;gap:14px;background:#fcf9f2;opacity:0;visibility:hidden}
html.dark .pt-splash{background:#1c2a20}
html.pt-splash-active .pt-splash{opacity:1;visibility:visible}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat | PaliTrento</title>
<meta name="description" content="Chat with buyer/seller about your order.">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="pt-splash" aria-hidden="true">
  <svg class="pt-splash__logo" width="150" height="166" viewBox="35 15 465 515" focusable="false">
    <defs>
      <filter id="pt-outline" filterUnits="userSpaceOnUse" x="0" y="-120" width="540" height="720" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="grow"/>
        <feFlood flood-color="#ffffff"/>
        <feComposite in2="grow" operator="in" result="white"/>
        <feMerge><feMergeNode in="white"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#pt-outline)">
      <ellipse class="pt-splash__base" cx="267.5" cy="490" rx="82" ry="22" fill="#1f4c47"/>
      <path class="pt-splash__pole" d="M225 150H310V440L267.5 474L225 440Z" fill="#70401a"/>
      <path class="pt-splash__scallop" style="--i:0" d="M55 46Q55 32 69 32H140V150A42.5 42.5 0 0 1 55 150Z" fill="#1e4b46"/>
      <path class="pt-splash__scallop" style="--i:1" d="M140 32H225V150A42.5 42.5 0 0 1 140 150Z" fill="#fdc147"/>
      <path class="pt-splash__scallop" style="--i:2" d="M225 32H310V150A42.5 42.5 0 0 1 225 150Z" fill="#1e4b46"/>
      <path class="pt-splash__scallop" style="--i:3" d="M310 32H395V150A42.5 42.5 0 0 1 310 150Z" fill="#fdc147"/>
      <path class="pt-splash__scallop" style="--i:4" d="M395 32H466Q480 32 480 46V150A42.5 42.5 0 0 1 395 150Z" fill="#1e4b46"/>
    </g>
  </svg>
  <p class="pt-splash__word">PaliTrento</p>
  <p class="pt-splash__tag">Tara, Palit Ta sa Trento!</p>
</div>
<div id="chrome-top"></div>
<main>
<div class="wrap" style="max-width:720px;padding-top:24px;padding-bottom:48px">
  <!-- Back link -->
  <a href="/dashboard/" class="muted" style="display:inline-block;margin-bottom:16px;text-decoration:none">&larr; Back to dashboard</a>

  <div id="chat-container" style="display:none;flex-direction:column;height:calc(100vh - 200px);min-height:500px">
    <!-- Header -->
    <div style="display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line);background:var(--card)">
      <a href="#" id="chat-back-link" style="color:var(--primary);text-decoration:none;font-weight:600">&larr; Back</a>
      <div style="flex:1">
        <h2 id="chat-title" style="margin:0;font-size:1.1rem"></h2>
        <p class="muted" id="chat-subtitle" style="margin:0;font-size:.8rem"></p>
      </div>
      <span class="pill ok" id="chat-status" style="font-size:.7rem">Online</span>
    </div>

    <!-- Messages -->
    <div id="messages-list" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px"></div>

    <!-- Input -->
    <form id="message-form" style="padding:16px;border-top:1px solid var(--line);background:var(--card);display:flex;gap:8px">
      <input type="text" id="message-input" name="content" placeholder="Type a message..." required style="flex:1;padding:12px 16px;border:1px solid var(--line);border-radius:999px;font:inherit;min-width:0">
      <button type="submit" class="btn" style="width:auto;min-width:80px;padding:12px 20px">Send</button>
    </form>
  </div>

  <!-- Loading/Error -->
  <p class="muted" id="loading-msg" style="text-align:center;padding:48px">Loading chat...</p>
  <p class="muted" id="error-msg" style="display:none;text-align:center;padding:48px;color:var(--bad)"></p>
</div>
</main>
<div id="chrome-foot"></div>
<script type="module" src="/js/chat.js"></script>
</body>
</html>
