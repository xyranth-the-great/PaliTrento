<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
(function () {
  var d = document.documentElement;
  var mode = 'quick';
  try {
    if (!sessionStorage.getItem('pt-splash-seen')) {
      sessionStorage.setItem('pt-splash-seen', '1');
      mode = 'full';
    }
  } catch (e) {}
  d.setAttribute('data-splash', mode);
  d.classList.add('pt-splash-active');
})();
</script>
<style>
.pt-splash{position:fixed;inset:0;z-index:99999;display:grid;place-content:center;justify-items:center;gap:14px;background:#fcf9f2;opacity:0;visibility:hidden}
html.dark .pt-splash{background:#1c2a20}
html.pt-splash-active .pt-splash{opacity:1;visibility:visible}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Price Broadcasts | PaliTrento Admin</title>
<meta name="description" content="Create and manage Admin price advisories.">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="pt-splash" aria-hidden="true">
  <svg class="pt-splash__logo" width="150" height="166" viewBox="35 15 465 515" focusable="false">
    <defs>
      <filter id="pt-outline" filterUnits="userSpaceOnUse" x="0" y="-120" width="540" height="720" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="grow"/>
        <feFlood flood-color="#ffffff"/>
        <feComposite in2="grow" operator="in" result="white"/>
        <feMerge><feMergeNode in="white"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#pt-outline)">
      <ellipse class="pt-splash__base" cx="267.5" cy="490" rx="82" ry="22" fill="#1f4c47"/>
      <path class="pt-splash__pole" d="M225 150H310V440L267.5 474L225 440Z" fill="#70401a"/>
      <path class="pt-splash__scallop" style="--i:0" d="M55 46Q55 32 69 32H140V150A42.5 42.5 0 0 1 55 150Z" fill="#1e4b46"/>
      <path class="pt-splash__scallop" style="--i:1" d="M140 32H225V150A42.5 42.5 0 0 1 140 150Z" fill="#fdc147"/>
      <path class="pt-splash__scallop" style="--i:2" d="M225 32H310V150A42.5 42.5 0 0 1 225 150Z" fill="#1e4b46"/>
      <path class="pt-splash__scallop" style="--i:3" d="M310 32H395V150A42.5 42.5 0 0 1 310 150Z" fill="#fdc147"/>
      <path class="pt-splash__scallop" style="--i:4" d="M395 32H466Q480 32 480 46V150A42.5 42.5 0 0 1 395 150Z" fill="#1e4b46"/>
    </g>
  </svg>
  <p class="pt-splash__word">PaliTrento</p>
  <p class="pt-splash__tag">Tara, Palit Ta sa Trento!</p>
</div>
<div id="chrome-top"></div>
<main>
<div class="wrap" style="max-width:900px;padding-top:24px;padding-bottom:48px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <div>
      <h1 style="margin:0">Price Broadcasts</h1>
      <p class="muted">Send Admin price advisories to all barangays or specific ones</p>
    </div>
    <a href="/admin/" class="btn alt">← Dashboard</a>
  </div>

  <!-- Create Broadcast Card -->
  <div class="card" style="padding:24px;margin-bottom:32px">
    <h2 style="margin:0 0 16px">Create New Broadcast</h2>
    <form id="broadcast-form" novalidate style="display:grid;gap:16px">
      <div>
        <label for="b-title">Title <span class="bad">*</span></label>
        <input id="b-title" name="title" type="text" required placeholder="e.g., New Rice Price Cap Effective Monday">
      </div>

      <div>
        <label for="b-body">Message <span class="bad">*</span></label>
        <textarea id="b-body" name="body" rows="4" required placeholder="The Admin has issued a new price ceiling for well-milled rice at ₱52/kg effective March 15. All retailers must comply."></textarea>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div>
          <label for="b-category">Category <span class="bad">*</span></label>
          <select id="b-category" name="category" required>
            <option value="PRICE_CAP">Price Cap</option>
            <option value="ANNOUNCEMENT">Announcement</option>
            <option value="EMERGENCY">Emergency</option>
            <option value="GENERAL">General</option>
          </select>
        </div>
        <div>
          <label for="b-priority">Priority <span class="bad">*</span></label>
          <select id="b-priority" name="priority" required>
            <option value="low">Low</option>
            <option value="normal" selected>Normal</option>
            <option value="high">High</option>
            <option value="critical">Critical</option>
          </select>
        </div>
      </div>

      <div>
        <label for="b-barangay">Target Barangay (optional)</label>
        <select id="b-barangay" name="barangay">
          <option value="">All barangays</option>
        </select>
      </div>

      <div>
        <label for="b-expires">Expires at (optional)</label>
        <input id="b-expires" name="expires_at" type="datetime-local">
        <p class="muted" style="font-size:.8rem;margin-top:4px">Leave blank for no expiration</p>
      </div>

      <button type="submit" class="btn" style="width:fit-content">Send Broadcast</button>
    </form>

    <p id="broadcast-msg" class="muted" style="margin-top:12px;min-height:1.5em"></p>
  </div>

  <!-- Broadcasts List -->
  <div class="card" style="padding:20px">
    <h2 style="margin:0 0 16px">Previous Broadcasts</h2>
    <div id="broadcasts-list" class="grid" style="display:none"></div>
    <p class="muted" id="no-broadcasts" style="display:none;text-align:center;padding:32px">No broadcasts yet.</p>
  </div>

</div>
</main>
<div id="chrome-foot"></div>
<script type="module" src="/js/admin-prices.js"></script>
</body>
</html>
