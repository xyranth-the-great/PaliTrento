<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account Moderation | PaliTrento Admin</title>
<meta name="description" content="Review and moderate PaliTrento accounts.">
<link rel="icon" type="image/png" href="./logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<style>
  .account-row { display:grid; grid-template-columns:minmax(180px,1.3fr) minmax(120px,.8fr) minmax(190px,1fr) minmax(130px,.7fr); gap:12px; align-items:center; padding:16px 0; border-bottom:1px solid var(--line); }
  .account-actions { display:flex; gap:8px; min-width:0; }
  .account-actions select { min-width:0; flex:1; }
  .moderation-dialog { width:min(480px,calc(100% - 32px)); border:1px solid var(--line); border-radius:var(--r-lg); padding:24px; color:var(--ink); background:var(--card); }
  .moderation-dialog::backdrop { background:rgba(15,23,42,.48); }
  @media (max-width:760px) {
    .account-row { grid-template-columns:1fr; gap:8px; }
    .account-actions { margin-top:4px; }
  }
</style>
  <script type="module" crossorigin src="./assets/admin-accounts-BL3OBd9Q.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="./assets/styles-lfujndA6.js">
  <link rel="modulepreload" crossorigin href="./assets/ui-BQtFlIep.js">
  <link rel="modulepreload" crossorigin href="./assets/supabase-qt0oOlL5.js">
  <link rel="modulepreload" crossorigin href="./assets/auth-BNd5RyvG.js">
  <link rel="stylesheet" crossorigin href="./assets/styles-BYiDBinS.css">
</head>
<body>
<div id="chrome-top"></div>
<main>
<div class="wrap" style="max-width:1100px;padding-top:24px;padding-bottom:48px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <div>
      <h1 style="margin:0">Account Moderation</h1>
      <p class="muted">Warnings and suspensions are recorded with the administrator and reason.</p>
    </div>
    <a href="/admin/" class="btn alt">Back to dashboard</a>
  </div>

  <section class="card" style="padding:20px">
    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
      <label style="flex:1;min-width:220px">
        <span class="muted" style="display:block;margin-bottom:6px">Search accounts</span>
        <input id="account-search" type="search" placeholder="Name or email" autocomplete="off">
      </label>
      <label style="min-width:180px">
        <span class="muted" style="display:block;margin-bottom:6px">Account status</span>
        <select id="account-filter">
          <option value="all">All accounts</option>
          <option value="active">Active</option>
          <option value="suspended">Suspended</option>
        </select>
      </label>
    </div>
    <p id="account-list-message" class="muted" role="status" aria-live="polite">Loading accounts...</p>
    <div id="account-list"></div>
  </section>
</div>
</main>
<div id="chrome-foot"></div>

<dialog id="moderation-dialog" class="moderation-dialog">
  <form id="moderation-form">
    <h2 id="moderation-title" style="margin:0 0 8px">Moderate account</h2>
    <p id="moderation-account" class="muted" style="margin:0 0 16px"></p>
    <label id="duration-field" style="display:block;margin-bottom:14px">
      <span style="display:block;margin-bottom:6px">Suspension period</span>
      <select id="moderation-duration">
        <option value="24">24 hours</option>
        <option value="168">7 days</option>
        <option value="720">30 days</option>
      </select>
    </label>
    <label style="display:block;margin-bottom:16px">
      <span style="display:block;margin-bottom:6px">Reason</span>
      <textarea id="moderation-reason" rows="4" maxlength="1000" required placeholder="Explain the policy violation"></textarea>
    </label>
    <p id="moderation-message" class="muted" role="status" aria-live="polite"></p>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px">
      <button type="button" class="btn alt" id="moderation-cancel">Cancel</button>
      <button type="submit" class="btn" id="moderation-submit">Confirm</button>
    </div>
  </form>
</dialog>

</body>
</html>
