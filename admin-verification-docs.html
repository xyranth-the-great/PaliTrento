<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
(function () {
  var d = document.documentElement;
  var mode = 'quick';
  try {
    if (!sessionStorage.getItem('pt-splash-seen')) {
      sessionStorage.setItem('pt-splash-seen', '1');
      mode = 'full';
    }
  } catch (e) {}
  d.setAttribute('data-splash', mode);
  d.classList.add('pt-splash-active');
})();
</script>
<style>
.pt-splash{position:fixed;inset:0;z-index:99999;display:grid;place-content:center;justify-items:center;gap:14px;background:#fcf9f2;opacity:0;visibility:hidden}
html.dark .pt-splash{background:#1c2a20}
html.pt-splash-active .pt-splash{opacity:1;visibility:visible}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Business Document Verification | PaliTrento Admin</title>
<meta name="description" content="Review and approve business verification documents.">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .admin-verification-docs-page .wrap { max-width: 1200px; }
  .verification-filters { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; align-items: end; }
  .verification-filters > * { flex: 1; min-width: 200px; }
  .verification-table { width: 100%; border-collapse: collapse; }
  .verification-table th, .verification-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--line); }
  .verification-table th { font-weight: 700; font-size: 0.85rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.02em; }
  .verification-table tr:hover { background: var(--muted-bg); }
  .doc-status { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
  .doc-status-pending { background: var(--warn-bg); color: var(--warn); }
  .doc-status-approved { background: var(--ok-bg); color: var(--ok); }
  .doc-status-rejected { background: var(--bad-bg); color: var(--bad); }
  .doc-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .doc-actions .btn { padding: 6px 12px; font-size: 0.8rem; }
  .modal-content { max-height: 80vh; overflow: auto; }
  .document-preview { max-width: 100%; max-height: 60vh; border-radius: var(--r-lg); border: 1px solid var(--line); }
  .rejection-form { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  @media (max-width: 760px) {
    .verification-table { font-size: 0.85rem; }
    .verification-table th, .verification-table td { padding: 8px; }
    .doc-actions { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="pt-splash" aria-hidden="true">
  <svg class="pt-splash__logo" width="150" height="166" viewBox="35 15 465 515" focusable="false">
    <defs>
      <filter id="pt-outline" filterUnits="userSpaceOnUse" x="0" y="-120" width="540" height="720" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="grow"/>
        <feFlood flood-color="#ffffff"/>
        <feComposite in2="grow" operator="in" result="white"/>
        <feMerge><feMergeNode in="white"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#pt-outline)">
      <ellipse class="pt-splash__base" cx="267.5" cy="490" rx="82" ry="22" fill="#1f4c47"/>
      <path class="pt-splash__pole" d="M225 150H310V440L267.5 474L225 440Z" fill="#70401a"/>
      <path class="pt-splash__scallop" style="--i:0" d="M55 46Q55 32 69 32H140V150A42.5 42.5 0 0 1 55 150Z" fill="#1e4b46"/>
      <path class="pt-splash__scallop" style="--i:1" d="M140 32H225V150A42.5 42.5 0 0 1 140 150Z" fill="#fdc147"/>
      <path class="pt-splash__scallop" style="--i:2" d="M225 32H310V150A42.5 42.5 0 0 1 225 150Z" fill="#1e4b46"/>
      <path class="pt-splash__scallop" style="--i:3" d="M310 32H395V150A42.5 42.5 0 0 1 310 150Z" fill="#fdc147"/>
      <path class="pt-splash__scallop" style="--i:4" d="M395 32H466Q480 32 480 46V150A42.5 42.5 0 0 1 395 150Z" fill="#1e4b46"/>
    </g>
  </svg>
  <p class="pt-splash__word">PaliTrento</p>
  <p class="pt-splash__tag">Tara, Palit Ta sa Trento!</p>
</div>
<div id="chrome-top"></div>
<main class="admin-verification-docs-page">
<div class="wrap" style="padding-top:24px;padding-bottom:48px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <div>
      <h1 style="margin:0">Business Document Verification</h1>
      <p class="muted">Review and approve/reject submitted business documents.</p>
    </div>
    <a href="/admin/" class="btn alt">Back to Admin Dashboard</a>
  </div>

  <div class="card" style="padding:20px">
    <div class="verification-filters">
      <div>
        <label for="filter-store" style="display:block;margin-bottom:6px;font-weight:600;font-size:.85rem">Search Store</label>
        <input id="filter-store" type="search" placeholder="Business name or TRN" autocomplete="off">
      </div>
      <div>
        <label for="filter-doc-type" style="display:block;margin-bottom:6px;font-weight:600;font-size:.85rem">Document Type</label>
        <select id="filter-doc-type">
          <option value="">All Types</option>
          <option value="BARANGAY_CLEARANCE">Barangay Clearance</option>
          <option value="CEDULA">Cedula</option>
          <option value="BUSINESS_PERMIT">Business Permit</option>
        </select>
      </div>
      <div>
        <label for="filter-status" style="display:block;margin-bottom:6px;font-weight:600;font-size:.85rem">Status</label>
        <select id="filter-status">
          <option value="">All Statuses</option>
          <option value="PENDING_REVIEW">Pending Review</option>
          <option value="APPROVED">Approved</option>
          <option value="REJECTED">Rejected</option>
        </select>
      </div>
    </div>

    <p id="verification-list-message" class="muted" role="status" aria-live="polite" style="margin-top:16px">Loading documents...</p>

    <div style="overflow-x:auto">
      <table class="verification-table" id="verification-table" style="display:none">
        <thead>
          <tr>
            <th>Store</th>
            <th>TRN</th>
            <th>Document Type</th>
            <th>Submitted</th>
            <th>Status</th>
            <th>File</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="verification-body"></tbody>
      </table>
    </div>

    <p id="no-verification" class="muted" style="display:none;text-align:center;padding:32px">No documents match this filter.</p>
  </div>
</div>
</main>
<div id="chrome-foot"></div>

<!-- Document Review Modal -->
<dialog id="doc-modal" class="modal" style="max-width:600px">
  <form id="doc-form">
    <h2 id="doc-modal-title" style="margin:0 0 8px">Review Document</h2>
    <p id="doc-modal-info" class="muted" style="margin:0 0 16px"></p>

    <div id="doc-preview-container" style="margin-bottom:16px"></div>

    <div class="rejection-form" id="rejection-form" style="display:none">
      <label for="rejection-reason">Rejection Reason <span style="color:var(--bad)">*</span></label>
      <textarea id="rejection-reason" rows="3" maxlength="1000" placeholder="Explain why this document is being rejected"></textarea>
    </div>

    <p id="doc-modal-message" class="muted" role="status" aria-live="polite"></p>

    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)">
      <button type="button" class="btn alt" id="doc-cancel">Cancel</button>
      <button type="button" class="btn bad" id="doc-reject" style="display:none">Reject</button>
      <button type="button" class="btn ok" id="doc-approve">Approve</button>
    </div>
  </form>
</dialog>

<script type="module">
import { renderChrome, $, esc, CATS } from './js/ui.js';
import { getSessionWithStatus, checkAuthErrorParams } from './js/auth.js';
import { supabase } from './js/supabase.js';
import { isSupabaseConfigured } from './js/auth.js';

const modal = $('#doc-modal');
const form = $('#doc-form');
let currentDoc = null;

async function init() {
  if (!isSupabaseConfigured()) return;

  // Check for auth error params from Supabase redirect
  const authErrorRedirect = checkAuthErrorParams();
  if (authErrorRedirect) {
    window.location.replace(authErrorRedirect);
    return;
  }

  const { session, profile, redirectUrl } = await getSessionWithStatus();
  if (redirectUrl) {
    window.location.replace(redirectUrl);
    return;
  }
  if (!session) {
    window.location.href = '/login/';
    return;
  }

  if (!profile || profile.role !== 'admin') {
    window.location.href = '/';
    return;
  }

  renderChrome('/admin-verification-docs/', session, profile);

  // Bind events
  $('#filter-store')?.addEventListener('input', debounce(() => loadDocuments(), 300));
  $('#filter-doc-type')?.addEventListener('change', () => loadDocuments());
  $('#filter-status')?.addEventListener('change', () => loadDocuments());
  $('#doc-cancel')?.addEventListener('click', () => modal.close());
  $('#doc-approve')?.addEventListener('click', () => reviewDocument('APPROVE'));
  $('#doc-reject')?.addEventListener('click', () => reviewDocument('REJECT'));
  modal?.addEventListener('click', (e) => { if (e.target === modal) modal.close(); });

  await loadDocuments();
}

function debounce(fn, ms) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

async function loadDocuments() {
  const storeSearch = $('#filter-store').value.trim().toLowerCase();
  const docType = $('#filter-doc-type').value;
  const status = $('#filter-status').value;

  let query = supabase
    .from('business_documents')
    .select('*, stores(business_name, trn_code, user_id)');

  if (docType) query = query.eq('document_type', docType);
  if (status) query = query.eq('status', status);

  const { data, error } = await query.order('submitted_at', { ascending: false });

  if (error) {
    console.error('Load documents error:', error);
    $('#verification-list-message').textContent = 'Failed to load documents.';
    return;
  }

  // Client-side store search filter
  let filtered = data || [];
  if (storeSearch) {
    filtered = filtered.filter(d =>
      d.stores?.business_name?.toLowerCase().includes(storeSearch) ||
      d.stores?.trn_code?.toLowerCase().includes(storeSearch)
    );
  }

  renderDocuments(filtered);
  $('#verification-list-message').textContent = filtered.length ? `${filtered.length} document(s)` : 'No documents found.';
}

function renderDocuments(documents) {
  const tbody = $('#verification-body');
  const table = $('#verification-table');
  const noResults = $('#no-verification');

  if (documents.length === 0) {
    table.style.display = 'none';
    noResults.style.display = 'block';
    return;
  }

  noResults.style.display = 'none';
  table.style.display = 'table';

  tbody.innerHTML = documents.map(doc => {
    const store = doc.stores;
    const statusClasses = {
      PENDING_REVIEW: 'doc-status-pending',
      APPROVED: 'doc-status-approved',
      REJECTED: 'doc-status-rejected'
    };
    const statusLabels = {
      PENDING_REVIEW: 'Pending Review',
      APPROVED: 'Approved',
      REJECTED: 'Rejected'
    };

    let actionsHtml = '';
    if (doc.status === 'PENDING_REVIEW') {
      actionsHtml = `
        <button class="btn ok" data-action="approve" data-id="${doc.id}">Approve</button>
        <button class="btn bad" data-action="reject" data-id="${doc.id}">Reject</button>
        <button class="btn alt" data-action="view" data-id="${doc.id}">View</button>
      `;
    } else if (doc.status === 'REJECTED') {
      actionsHtml = `
        <button class="btn alt" data-action="view" data-id="${doc.id}">View</button>
        <span class="muted" style="font-size:.75rem">${esc(doc.rejection_reason || 'No reason')}</span>
      `;
    } else {
      actionsHtml = `
        <button class="btn alt" data-action="view" data-id="${doc.id}">View</button>
      `;
    }

    const fileName = doc.file_name || 'Unknown file';
    const fileLink = doc.file_path
      ? `<button class="btn alt" data-action="view" data-id="${doc.id}" style="padding:4px 8px;font-size:.7rem">View</button>`
      : '<span class="muted">No file</span>';

    return `
      <tr data-id="${doc.id}">
        <td>${esc(store?.business_name || 'Unknown Store')}</td>
        <td>${esc(store?.trn_code || '—')}</td>
        <td>${formatDocType(doc.document_type)}</td>
        <td>${doc.submitted_at ? new Date(doc.submitted_at).toLocaleString('en-PH', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : '—'}</td>
        <td><span class="doc-status ${statusClasses[doc.status] || 'doc-status-pending'}">${statusLabels[doc.status] || doc.status}</span></td>
        <td>${fileLink}</td>
        <td><div class="doc-actions">${actionsHtml}</div></td>
      </tr>
    `;
  }).join('');

  // Bind action buttons
  tbody.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      const id = btn.dataset.id;
      if (action === 'view') openViewModal(id);
      else if (action === 'approve') openReviewModal(id, 'APPROVE');
      else if (action === 'reject') openReviewModal(id, 'REJECT');
    });
  });
}

function formatDocType(type) {
  return ({
    BARANGAY_CLEARANCE: 'Barangay Clearance',
    CEDULA: 'Cedula',
    BUSINESS_PERMIT: 'Business Permit'
  })[type] || type;
}

async function openViewModal(docId) {
  const { data: doc, error } = await supabase
    .from('business_documents')
    .select('*, stores(business_name, trn_code)')
    .eq('id', docId)
    .maybeSingle();

  if (error || !doc) {
    alert('Failed to load document');
    return;
  }

  currentDoc = doc;
  const store = doc.stores;

  $('#doc-modal-title').textContent = `View Document: ${formatDocType(doc.document_type)}`;
  $('#doc-modal-info').textContent = `${esc(store?.business_name || 'Unknown')} (${esc(store?.trn_code || '—')}) · Submitted ${doc.submitted_at ? new Date(doc.submitted_at).toLocaleString('en-PH') : '—'}`;

  // Preview
  let previewHtml = '';
  if (doc.file_path) {
    const { data: urlData } = await supabase.storage
      .from('business-documents')
      .createSignedUrl(doc.file_path, 60 * 60); // 1 hour
    if (urlData?.signedUrl) {
      if (doc.mime_type?.startsWith('image/')) {
        previewHtml = `<img src="${urlData.signedUrl}" alt="Document preview" class="document-preview">`;
      } else {
        previewHtml = `<p class="muted">PDF document. <a href="${urlData.signedUrl}" target="_blank" class="btn alt" style="font-size:.8rem;padding:6px 12px">Open in New Tab</a></p>`;
      }
    }
  } else {
    previewHtml = '<p class="muted">No file available</p>';
  }
  $('#doc-preview-container').innerHTML = previewHtml;

  // Hide review buttons for view mode
  $('#doc-approve').style.display = 'none';
  $('#doc-reject').style.display = 'none';
  $('#rejection-form').style.display = 'none';

  modal.showModal();
}

function openReviewModal(docId, action) {
  const doc = Array.from(document.querySelectorAll('#verification-body tr[data-id]'))
    .map(tr => tr.dataset.id)
    .includes(docId) ? docId : null;

  // Fetch full doc data
  currentDoc = null;
  fetchDoc(docId).then(docData => {
    currentDoc = docData;
    const store = docData.stores;

    $('#doc-modal-title').textContent = action === 'APPROVE' ? 'Approve Document' : 'Reject Document';
    $('#doc-modal-info').textContent = `${esc(store?.business_name || 'Unknown')} (${esc(store?.trn_code || '—')}) · ${formatDocType(docData.document_type)}`;

    // Preview
    let previewHtml = '';
    if (docData.file_path) {
      supabase.storage
        .from('business-documents')
        .createSignedUrl(docData.file_path, 60 * 60)
        .then(({ data: urlData }) => {
          if (urlData?.signedUrl) {
            if (docData.mime_type?.startsWith('image/')) {
              previewHtml = `<img src="${urlData.signedUrl}" alt="Document preview" class="document-preview">`;
            } else {
              previewHtml = `<p class="muted">PDF document. <a href="${urlData.signedUrl}" target="_blank" class="btn alt" style="font-size:.8rem;padding:6px 12px">Open in New Tab</a></p>`;
            }
            $('#doc-preview-container').innerHTML = previewHtml;
          }
        });
    }

    // Show/hide rejection form
    if (action === 'REJECT') {
      $('#doc-approve').style.display = 'none';
      $('#doc-reject').style.display = 'inline-flex';
      $('#rejection-form').style.display = 'block';
      $('#rejection-reason').required = true;
    } else {
      $('#doc-approve').style.display = 'inline-flex';
      $('#doc-reject').style.display = 'none';
      $('#rejection-form').style.display = 'none';
      $('#rejection-reason').required = false;
    }

    modal.showModal();
  });
}

async function fetchDoc(docId) {
  const { data, error } = await supabase
    .from('business_documents')
    .select('*, stores(business_name, trn_code)')
    .eq('id', docId)
    .maybeSingle();
  if (error) throw error;
  return data;
}

async function reviewDocument(action) {
  if (!currentDoc) return;

  const rejectionReason = $('#rejection-reason').value.trim();
  if (action === 'REJECT' && !rejectionReason) {
    $('#doc-modal-message').textContent = 'Rejection reason is required.';
    $('#rejection-reason').focus();
    return;
  }

  const btn = action === 'APPROVE' ? $('#doc-approve') : $('#doc-reject');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = action === 'APPROVE' ? 'Approving...' : 'Rejecting...';
  $('#doc-modal-message').textContent = '';

  try {
    const { error } = await supabase.rpc('admin_review_business_document', {
      p_actor_id: (await supabase.auth.getUser()).data.user.id,
      p_document_id: currentDoc.id,
      p_action: action,
      p_rejection_reason: rejectionReason || null
    });

    if (error) throw error;

    modal.close();
    $('#doc-modal-message').textContent = '';
    await loadDocuments();
  } catch (err) {
    console.error('Review document error:', err);
    $('#doc-modal-message').textContent = err.message || 'Failed to review document. Please try again.';
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

init();
</script>
</body>
</html>
