<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
(function () {
  var d = document.documentElement;
  var mode = 'quick';
  try {
    if (!sessionStorage.getItem('pt-splash-seen')) {
      sessionStorage.setItem('pt-splash-seen', '1');
      mode = 'full';
    }
  } catch (e) {}
  d.setAttribute('data-splash', mode);
  d.classList.add('pt-splash-active');
})();
</script>
<style>
.pt-splash{position:fixed;inset:0;z-index:99999;display:grid;place-content:center;justify-items:center;gap:14px;background:#fcf9f2;opacity:0;visibility:hidden}
html.dark .pt-splash{background:#1c2a20}
html.pt-splash-active .pt-splash{opacity:1;visibility:visible}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>All Notifications | PaliTrento</title>
<meta name="description" content="View all notifications and advisories from PaliTrento">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="advisories-page">
<div class="pt-splash" aria-hidden="true">
  <svg class="pt-splash__logo" width="150" height="166" viewBox="35 15 465 515" focusable="false">
    <defs>
      <filter id="pt-outline" filterUnits="userSpaceOnUse" x="0" y="-120" width="540" height="720" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="grow"/>
        <feFlood flood-color="#ffffff"/>
        <feComposite in2="grow" operator="in" result="white"/>
        <feMerge><feMergeNode in="white"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#pt-outline)">
      <ellipse class="pt-splash__base" cx="267.5" cy="490" rx="82" ry="22" fill="#1f4c47"/>
      <path class="pt-splash__pole" d="M225 150H310V440L267.5 474L225 440Z" fill="#70401a"/>
      <path class="pt-splash__scallop" style="--i:0" d="M55 46Q55 32 69 32H140V150A42.5 42.5 0 0 1 55 150Z" fill="#1e4b46"/>
      <path class="pt-splash__scallop" style="--i:1" d="M140 32H225V150A42.5 42.5 0 0 1 140 150Z" fill="#fdc147"/>
      <path class="pt-splash__scallop" style="--i:2" d="M225 32H310V150A42.5 42.5 0 0 1 225 150Z" fill="#1e4b46"/>
      <path class="pt-splash__scallop" style="--i:3" d="M310 32H395V150A42.5 42.5 0 0 1 310 150Z" fill="#fdc147"/>
      <path class="pt-splash__scallop" style="--i:4" d="M395 32H466Q480 32 480 46V150A42.5 42.5 0 0 1 395 150Z" fill="#1e4b46"/>
    </g>
  </svg>
  <p class="pt-splash__word">PaliTrento</p>
  <p class="pt-splash__tag">Tara, Palit Ta sa Trento!</p>
</div>
<div id="chrome-top"></div>
<main>
  <section class="bhead">
    <div class="wrap">
      <h1>Notifications</h1>
      <p class="muted" style="margin:8px 0 0">Advisories, chat messages, and reservations from PaliTrento</p>
    </div>
  </section>
  <section>
    <div class="wrap">
      <div class="filters" style="grid-template-columns: 1fr auto auto; gap: 12px; align-items: end; margin-bottom: 24px;">
        <div>
          <label for="q" class="sr" style="position:absolute;left:-9999px">Search notifications</label>
          <input id="q" type="search" placeholder="Search notifications..." style="width:100%">
        </div>
        <div>
          <label for="cat">Category</label>
          <select id="cat">
            <option value="">All categories</option>
            <option value="PRICE_CAP">Price Cap</option>
            <option value="ANNOUNCEMENT">Announcement</option>
            <option value="EMERGENCY">Emergency</option>
            <option value="GENERAL">General</option>
            <option value="MESSAGE">Messages</option>
            <option value="RESERVATION">Reservations</option>
            <option value="ORDER_STATUS">Order updates</option>
          </select>
        </div>
        <div>
          <label for="status">Status</label>
          <select id="status">
            <option value="">All</option>
            <option value="unread">Unread</option>
            <option value="read">Read</option>
          </select>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px">
        <div id="count" style="font-size:.95rem;font-weight:600;color:var(--muted)"></div>
        <button id="clear-all-notifications" class="btn alt" type="button" hidden style="padding:8px 12px;font-size:.85rem;white-space:nowrap">Clear all</button>
      </div>

      <div id="list" class="notification-list" style="display:grid;gap:12px"></div>

      <div id="pagination" style="display:flex;justify-content:center;gap:8px;margin-top:24px"></div>

      <div id="empty" class="empty" hidden style="grid-column:1/-1">
        <h3>No notifications found</h3>
        <p class="muted">Try adjusting your filters or search term.</p>
      </div>
    </div>
  </section>
</main>
<div id="chrome-foot"></div>
<script type="module" src="/js/advisories.js"></script>
</body>
</html>
