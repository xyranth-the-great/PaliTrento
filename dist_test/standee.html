<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Generate QR Standee | PaliTrento</title>
<meta name="description" content="Generate a QR standee for your store.">
<link rel="icon" type="image/png" href="./assets/logo-DrGexIuc.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
  <script type="module" crossorigin src="./assets/standee-BV3eainv.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/auth-bXQxvQf8.js">
  <link rel="modulepreload" crossorigin href="./assets/ui-ykS8AFOO.js">
  <link rel="stylesheet" crossorigin href="./assets/auth-BlvKCdBe.css">
</head>
<body>
<div id="chrome-top"></div>
<main>
<div class="wrap" style="max-width:720px;padding-top:24px;padding-bottom:48px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <div>
      <h1 style="margin:0">Generate QR Standee</h1>
      <p class="muted">Create a printable QR standee for your store</p>
    </div>
    <a href="dashboard.html" class="btn alt">← Dashboard</a>
  </div>

  <div id="standee-content" style="display:none">
    <!-- Store Info Card -->
    <div class="card" style="padding:20px;margin-bottom:24px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px">
        <div>
          <h2 id="standee-store-name" style="margin:0 0 4px"></h2>
          <p class="muted" id="standee-store-category"></p>
        </div>
        <img id="standee-storefront" src="" alt="Storefront" style="width:80px;height:80px;object-fit:cover;border-radius:var(--r-lg);display:none">
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;font-size:.9rem">
        <div><span class="muted">Address:</span> <strong id="standee-address"></strong></div>
        <div><span class="muted">Hours:</span> <strong id="standee-hours"></strong></div>
        <div><span class="muted">Payments:</span> <strong id="standee-payments"></strong></div>
        <div id="standee-badges"></div>
      </div>
    </div>

    <!-- QR Code Preview -->
    <div class="card" style="padding:20px;margin-bottom:24px;text-align:center">
      <h3 style="margin:0 0 16px">QR Code Preview</h3>
      <p class="muted" style="margin-bottom:16px">Customers scan this to view your store on PaliTrento</p>
      <div id="qr-preview" style="display:inline-block;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)">
        <div id="qr-canvas-container"></div>
        <p class="muted" style="margin-top:8px;font-size:.8rem">Scan to open store page</p>
      </div>
    </div>

    <!-- Standee Format Options -->
    <div class="card" style="padding:20px;margin-bottom:24px">
      <h3 style="margin:0 0 16px">Standee Format</h3>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="radio" name="format" value="a5" checked>
          <span>A5 (148×210 mm) — Standard standee size</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="radio" name="format" value="a4">
          <span>A4 (210×297 mm) — Full page</span>
        </label>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="radio" name="orientation" value="portrait" checked>
          <span>Portrait</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="radio" name="orientation" value="landscape">
          <span>Landscape</span>
        </label>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" name="includeMap" id="includeMap" checked>
          <span>Include map snippet</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" name="includeHours" id="includeHours" checked>
          <span>Include hours</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" name="includePayments" id="includePayments" checked>
          <span>Include payment methods</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
          <input type="checkbox" name="includeBadges" id="includeBadges" checked>
          <span>Include verification badges</span>
        </label>
      </div>
    </div>

    <!-- Actions -->
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end">
      <button type="button" class="btn alt" id="preview-btn">Preview PDF</button>
      <button type="button" class="btn" id="download-btn">Download PDF</button>
    </div>

    <p id="standee-message" class="muted" style="margin-top:16px;min-height:1.5em"></p>
  </div>

  <!-- Loading/Error States -->
  <p class="muted" id="loading-msg" style="text-align:center;padding:48px">Loading store data...</p>
  <p class="muted" id="error-msg" style="display:none;text-align:center;padding:48px;color:var(--bad)"></p>
</div>
</main>
<div id="chrome-foot"></div>
</body>
</html>
