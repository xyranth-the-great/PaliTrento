<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in | PaliTrento</title>
<meta name="description" content="Log in to your PaliTrento account.">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="chrome-top"></div>
<main>
<div class="wrap" style="max-width:480px;padding-top:48px;padding-bottom:48px">
  <h1>Log in</h1>
  <p class="muted">Welcome back to PaliTrento.</p>

  <form id="login-form" novalidate style="margin-top:24px;display:grid;gap:16px">
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="juan@example.com">
    </div>

    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password">
      <p class="muted" style="margin-top:8px;text-align:right"><a href="forgot-password.html" style="font-size:0.875rem">Forgot password?</a></p>
    </div>

    <button type="submit" class="btn" style="width:100%">Log in</button>
  </form>

  <p id="login-message" class="muted" style="margin-top:16px;min-height:1.5em"></p>

  <p class="muted" style="margin-top:24px">
    Don't have an account? <a href="register.html">Register as customer</a>
  </p>

  <p class="muted" style="margin-top:12px">
    Register as business owner? <a href="register-business.html">Create business account</a>
  </p>

  <p class="muted" style="margin-top:16px">
    <a href="explore.html">Explore instead</a>
  </p>
</div>
</main>
<div id="chrome-foot"></div>
<script type="module" src="js/login.js"></script>
</body>
</html>
