<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
(function () {
  var d = document.documentElement;
  var mode = 'quick';
  try {
    if (!sessionStorage.getItem('pt-splash-seen')) {
      sessionStorage.setItem('pt-splash-seen', '1');
      mode = 'full';
    }
  } catch (e) {}
  d.setAttribute('data-splash', mode);
  d.classList.add('pt-splash-active');
})();
</script>
<style>
.pt-splash{position:fixed;inset:0;z-index:99999;display:grid;place-content:center;justify-items:center;gap:14px;background:#fcf9f2;opacity:0;visibility:hidden}
html.dark .pt-splash{background:#1c2a20}
html.pt-splash-active .pt-splash{opacity:1;visibility:visible}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in | PaliTrento</title>
<meta name="description" content="Log in to your PaliTrento account.">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="pt-splash" aria-hidden="true">
  <svg class="pt-splash__logo" width="150" height="166" viewBox="35 15 465 515" focusable="false">
    <defs>
      <filter id="pt-outline" filterUnits="userSpaceOnUse" x="0" y="-120" width="540" height="720" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="grow"/>
        <feFlood flood-color="#ffffff"/>
        <feComposite in2="grow" operator="in" result="white"/>
        <feMerge><feMergeNode in="white"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#pt-outline)">
      <ellipse class="pt-splash__base" cx="267.5" cy="490" rx="82" ry="22" fill="#1f4c47"/>
      <path class="pt-splash__pole" d="M225 150H310V440L267.5 474L225 440Z" fill="#70401a"/>
      <path class="pt-splash__scallop" style="--i:0" d="M55 46Q55 32 69 32H140V150A42.5 42.5 0 0 1 55 150Z" fill="#1e4b46"/>
      <path class="pt-splash__scallop" style="--i:1" d="M140 32H225V150A42.5 42.5 0 0 1 140 150Z" fill="#fdc147"/>
      <path class="pt-splash__scallop" style="--i:2" d="M225 32H310V150A42.5 42.5 0 0 1 225 150Z" fill="#1e4b46"/>
      <path class="pt-splash__scallop" style="--i:3" d="M310 32H395V150A42.5 42.5 0 0 1 310 150Z" fill="#fdc147"/>
      <path class="pt-splash__scallop" style="--i:4" d="M395 32H466Q480 32 480 46V150A42.5 42.5 0 0 1 395 150Z" fill="#1e4b46"/>
    </g>
  </svg>
  <p class="pt-splash__word">PaliTrento</p>
  <p class="pt-splash__tag">Tara, Palit Ta sa Trento!</p>
</div>
<div id="chrome-top"></div>
<main>
<div class="wrap" style="max-width:480px;padding-top:48px;padding-bottom:48px">
  <h1>Log in</h1>
  <p class="muted">Welcome back to PaliTrento.</p>

  <form id="login-form" novalidate style="margin-top:24px;display:grid;gap:16px">
    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="juan@example.com">
    </div>

    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Your password">
      <p class="muted" style="margin-top:8px;text-align:right"><a href="/forgot-password/" style="font-size:0.875rem">Forgot password?</a></p>
    </div>

    <button type="submit" class="btn" style="width:100%">Log in</button>
  </form>

  <div style="display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted);font-size:.875rem">
    <div style="flex:1;border-top:1px solid var(--line)"></div>
    <span>or continue with</span>
    <div style="flex:1;border-top:1px solid var(--line)"></div>
  </div>

  <button type="button" id="google-login-btn" class="btn alt" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    <span>Continue with Google</span>
  </button>

  <p id="login-message" class="muted" style="margin-top:16px;min-height:1.5em"></p>

  <p class="muted" style="margin-top:24px">
    Don't have an account? <a href="/register/">Register as customer</a>
  </p>

  <p class="muted" style="margin-top:12px">
    Register as business owner? <a href="/register-business/">Create business account</a>
  </p>

  <p class="muted" style="margin-top:16px">
    <a href="/explore/">Explore instead</a>
  </p>
</div>
</main>
<div id="chrome-foot"></div>
<script type="module" src="/js/login.js"></script>
</body>
</html>
