<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report Product | PaliTrento</title>
<meta name="description" content="Report a product for review by administrators.">
<link rel="icon" type="image/png" href="./logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<style>
  .report-page { max-width: 640px; margin: 0 auto; padding: var(--pad); }
  .report-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 32px; }
  .report-header { margin-bottom: 24px; text-align: center; }
  .report-header h1 { margin: 0 0 8px; }
  .report-header p { color: var(--muted); }
  .product-info { background: var(--muted-bg); border-radius: var(--r-lg); padding: 16px; margin-bottom: 24px; display: flex; gap: 12px; align-items: center; }
  .product-info img { width: 60px; height: 60px; object-fit: cover; border-radius: var(--r-md); background: var(--line); }
  .product-info .text h3 { margin: 0 0 4px; font-size: 1rem; }
  .product-info .text p { margin: 0; color: var(--muted); font-size: 0.85rem; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; }
  .form-group select, .form-group textarea { width: 100%; padding: 11px 12px; border: 1px solid #8a948d; border-radius: var(--r-md); background: #fff; font: inherit; }
  .form-group textarea { min-height: 120px; resize: vertical; }
  .form-group .hint { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
  .required { color: var(--bad); }
  .btn-submit { width: 100%; padding: 14px; font-size: 1rem; }
  .back-link { display: inline-block; margin-top: 16px; color: var(--primary); text-decoration: underline; }
</style>
  <script type="module" crossorigin src="./assets/report-product-DLpjIMAG.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="./assets/styles-lfujndA6.js">
  <link rel="modulepreload" crossorigin href="./assets/ui-RYbaGHoh.js">
  <link rel="modulepreload" crossorigin href="./assets/supabase-qt0oOlL5.js">
  <link rel="modulepreload" crossorigin href="./assets/auth-_FXb4y8X.js">
  <link rel="stylesheet" crossorigin href="./assets/styles-BYiDBinS.css">
</head>
<body>
<div id="chrome-top"></div>
<main class="report-page">
  <div class="report-card">
    <div class="report-header">
      <h1>Report Product</h1>
      <p>Help keep PaliTrento safe by reporting inappropriate or fraudulent product listings.</p>
    </div>

    <div class="product-info" id="product-info">
      <div style="width:60px;height:60px;border-radius:var(--r-md);background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.75rem">Loading</div>
      <div class="text">
        <h3>Loading...</h3>
        <p></p>
      </div>
    </div>

    <form id="report-form" novalidate>
      <div class="form-group">
        <label for="reason">Reason <span class="required">*</span></label>
        <select id="reason" name="reason" required>
          <option value="">Select a reason</option>
          <option value="INAPPROPRIATE_PRODUCT">Inappropriate product</option>
          <option value="PROHIBITED_PRODUCT">Prohibited or illegal product</option>
          <option value="MISLEADING_DESCRIPTION">Misleading product description</option>
          <option value="FRAUDULENT_LISTING">Fake or fraudulent listing</option>
          <option value="INCORRECT_PRICING">Incorrect pricing or information</option>
          <option value="COPYRIGHT_CONCERN">Copyright or intellectual property concern</option>
          <option value="OTHER">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Additional Details <span class="required">*</span></label>
        <textarea id="description" name="description" required placeholder="Please provide as much detail as possible to help us investigate..."></textarea>
        <p class="hint">Include specific examples, what you observed, or any evidence you have.</p>
      </div>

      <button type="submit" class="btn btn-submit" id="submit-btn">Submit Report</button>
    </form>

    <a href="#" id="back-link" class="back-link">← Back to product page</a>
  </div>
</main>
<div id="chrome-foot"></div>
</body>
</html>
