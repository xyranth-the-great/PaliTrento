<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Orders | PaliTrento</title>
<meta name="description" content="View your order history and track pickup orders.">
<link rel="icon" type="image/png" href="./assets/logo-DrGexIuc.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<style>
  .pickup-countdown { display:grid; gap:2px; margin-top:12px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--muted-bg); }
  .pickup-countdown-label { color:var(--muted); font-size:.76rem; font-weight:600; }
  .pickup-countdown-value { color:var(--primary-dark); font-size:.98rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .pickup-countdown-deadline { color:var(--muted); font-size:.76rem; }
  .pickup-countdown.is-warning { border-color:#f2d28a; background:var(--warn-bg); }
  .pickup-countdown.is-warning .pickup-countdown-value { color:var(--warn); }
  .pickup-countdown.is-expired { border-color:#efb6b6; background:var(--bad-bg); }
  .pickup-countdown.is-expired .pickup-countdown-value { color:var(--bad); }
  @media(max-width:480px) { .pickup-countdown { padding:9px 10px; } }
</style>
</head>
<body>
<div id="chrome-top"></div>
<main>
<div class="wrap" style="max-width:600px;padding-top:48px;padding-bottom:48px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <h1 style="margin:0">My Orders</h1>
    <a href="/products/" class="btn alt">Continue Shopping</a>
  </div>

  <div id="orders-content" style="display:none">
    <div id="orders-history"></div>
  </div>

  <p id="orders-message" class="muted" style="margin-top:16px;min-height:1.5em;display:none;text-align:center"></p>
</div>
</main>
<div id="chrome-foot"></div>
<script type="module" src="/js/orders.js"></script>
</body>
</html>
