<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
(function () {
  var d = document.documentElement;
  var mode = 'quick';
  try {
    if (!sessionStorage.getItem('pt-splash-seen')) {
      sessionStorage.setItem('pt-splash-seen', '1');
      mode = 'full';
    }
  } catch (e) {}
  d.setAttribute('data-splash', mode);
  d.classList.add('pt-splash-active');
})();
</script>
<style>
.pt-splash{position:fixed;inset:0;z-index:99999;display:grid;place-content:center;justify-items:center;gap:14px;background:#fcf9f2;opacity:0;visibility:hidden}
html.dark .pt-splash{background:#1c2a20}
html.pt-splash-active .pt-splash{opacity:1;visibility:visible}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Orders | PaliTrento</title>
<meta name="description" content="View your order history and track pickup orders.">
<link rel="icon" type="image/png" href="./assets/logo-DrGexIuc.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<style>
  .pickup-countdown { display:grid; gap:2px; margin-top:12px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--r-md); background:var(--muted-bg); }
  .pickup-countdown-label { color:var(--muted); font-size:.76rem; font-weight:600; }
  .pickup-countdown-value { color:var(--primary-dark); font-size:.98rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .pickup-countdown-deadline { color:var(--muted); font-size:.76rem; }
  .pickup-countdown.is-warning { border-color:#f2d28a; background:var(--warn-bg); }
  .pickup-countdown.is-warning .pickup-countdown-value { color:var(--warn); }
  .pickup-countdown.is-expired { border-color:#efb6b6; background:var(--bad-bg); }
  .pickup-countdown.is-expired .pickup-countdown-value { color:var(--bad); }
  .orders-filters { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; margin-bottom:12px; scrollbar-width:thin; }
  .orders-filter { flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; min-height:40px; padding:8px 12px; border:1px solid var(--line); border-radius:999px; background:var(--card); color:var(--ink); font:600 .82rem var(--font); cursor:pointer; }
  .orders-filter:hover { border-color:var(--primary); }
  .orders-filter[aria-pressed="true"] { border-color:var(--primary); background:var(--primary); color:#fff; }
  .orders-filter-count { min-width:20px; padding:1px 6px; border-radius:999px; background:var(--muted-bg); color:var(--muted); font-size:.72rem; text-align:center; font-variant-numeric:tabular-nums; }
  .orders-filter[aria-pressed="true"] .orders-filter-count { background:rgba(255,255,255,.18); color:#fff; }
  @media(max-width:480px) { .pickup-countdown { padding:9px 10px; } }
</style>
</head>
<body>
<div class="pt-splash" aria-hidden="true">
  <svg class="pt-splash__logo" width="150" height="166" viewBox="35 15 465 515" focusable="false">
    <defs>
      <filter id="pt-outline" filterUnits="userSpaceOnUse" x="0" y="-120" width="540" height="720" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="grow"/>
        <feFlood flood-color="#ffffff"/>
        <feComposite in2="grow" operator="in" result="white"/>
        <feMerge><feMergeNode in="white"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#pt-outline)">
      <ellipse class="pt-splash__base" cx="267.5" cy="490" rx="82" ry="22" fill="#1f4c47"/>
      <path class="pt-splash__pole" d="M225 150H310V440L267.5 474L225 440Z" fill="#70401a"/>
      <path class="pt-splash__scallop" style="--i:0" d="M55 46Q55 32 69 32H140V150A42.5 42.5 0 0 1 55 150Z" fill="#1e4b46"/>
      <path class="pt-splash__scallop" style="--i:1" d="M140 32H225V150A42.5 42.5 0 0 1 140 150Z" fill="#fdc147"/>
      <path class="pt-splash__scallop" style="--i:2" d="M225 32H310V150A42.5 42.5 0 0 1 225 150Z" fill="#1e4b46"/>
      <path class="pt-splash__scallop" style="--i:3" d="M310 32H395V150A42.5 42.5 0 0 1 310 150Z" fill="#fdc147"/>
      <path class="pt-splash__scallop" style="--i:4" d="M395 32H466Q480 32 480 46V150A42.5 42.5 0 0 1 395 150Z" fill="#1e4b46"/>
    </g>
  </svg>
  <p class="pt-splash__word">PaliTrento</p>
  <p class="pt-splash__tag">Tara, Palit Ta sa Trento!</p>
</div>
<div id="chrome-top"></div>
<main>
<div class="wrap" style="max-width:600px;padding-top:48px;padding-bottom:48px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <h1 style="margin:0">My Orders</h1>
    <a href="/products/" class="btn alt">Continue Shopping</a>
  </div>

  <div id="orders-content" style="display:none">
    <div id="orders-filters" class="orders-filters" role="group" aria-label="Filter orders by status"></div>
    <div id="orders-history"></div>
  </div>

  <p id="orders-message" class="muted" style="margin-top:16px;min-height:1.5em;display:none;text-align:center"></p>
</div>
</main>
<div id="chrome-foot"></div>
<script type="module" src="/js/orders.js"></script>
</body>
</html>
