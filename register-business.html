<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register as Business Owner | PaliTrento</title>
<meta name="description" content="Create your PaliTrento business owner account to manage your store.">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="chrome-top"></div>
<main>
<div class="wrap" style="max-width:480px;padding-top:48px;padding-bottom:48px">
  <h1>Register as Business Owner</h1>
  <p class="muted">Join PaliTrento to list your store, manage products, and reach local customers.</p>

  <form id="register-form" novalidate style="margin-top:24px;display:grid;gap:16px">
    <div>
      <label for="full_name">Full name</label>
      <input id="full_name" name="full_name" type="text" required autocomplete="name" placeholder="Juan Dela Cruz">
    </div>

    <div>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email" placeholder="juan@example.com">
    </div>

    <div>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required autocomplete="new-password" minlength="8" pattern="(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}" title="Use at least 8 characters, including a number and a special character." placeholder="8+ characters, a number & a symbol">
      <p class="muted" style="margin-top:4px">Use at least 8 characters, including a number and a special character (such as ! or #).</p>
    </div>

    <div>
      <label for="confirm_password">Confirm password</label>
      <input id="confirm_password" name="confirm_password" type="password" required autocomplete="new-password" placeholder="Re-enter password">
    </div>

    <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
      <input id="show-password" type="checkbox" style="width:auto;margin:0">
      Show password
    </label>

    <input type="hidden" name="role" value="business_owner">

    <div>
      <label for="barangay">Barangay <span class="muted" style="font-weight:400">(optional)</span></label>
      <select id="barangay" name="barangay">
        <option value="">Choose your barangay</option>
      </select>
    </div>

    <button type="submit" class="btn" style="width:100%">Create account & continue</button>
  </form>

  <p id="register-message" class="muted" style="margin-top:16px;min-height:1.5em"></p>

  <p class="muted" style="margin-top:24px">
    Already have an account? <a href="login.html">Log in</a>
  </p>
  <p class="muted" style="margin-top:8px">
    Register as customer instead? <a href="register.html">Customer registration</a>
  </p>
</div>
</main>
<div id="chrome-foot"></div>
<script type="module" src="js/register-business.js"></script>
</body>
</html>
