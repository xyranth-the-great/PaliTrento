// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('com.google.gms:google-services:4.4.2')
    def kotlinVersion = findProperty('android.kotlinVersion')
    classpath(kotlinVersion ? "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion" : 'org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// Keep Windows CMake/Ninja paths under MAX_PATH (260) for native library subprojects
if (System.getProperty('os.name', '').toLowerCase().contains('win')) {
  def shortPathsCmake = new File(rootDir, 'short-paths.cmake').absolutePath.replace('\\', '/')
  subprojects { sub ->
    if (sub.name != 'app' && !sub.state.executed) {
      sub.afterEvaluate {
        if (sub.plugins.hasPlugin('com.android.library')) {
          def androidExt = sub.extensions.findByName('android')
          if (androidExt?.externalNativeBuild?.cmake?.path != null) {
            androidExt.externalNativeBuild.cmake.buildStagingDirectory = file("C:/pt-cxx/${sub.name}")
            androidExt.defaultConfig.externalNativeBuild.cmake.arguments("-DCMAKE_PROJECT_INCLUDE=${shortPathsCmake}")
          }
        }
      }
    }
  }
}
