<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
(function () {
  var d = document.documentElement;
  var mode = 'quick';
  try {
    if (!sessionStorage.getItem('pt-splash-seen')) {
      sessionStorage.setItem('pt-splash-seen', '1');
      mode = 'full';
    }
  } catch (e) {}
  d.setAttribute('data-splash', mode);
  d.classList.add('pt-splash-active');
})();
</script>
<style>
.pt-splash{position:fixed;inset:0;z-index:99999;display:grid;place-content:center;justify-items:center;gap:14px;background:#fcf9f2;opacity:0;visibility:hidden}
html.dark .pt-splash{background:#1c2a20}
html.pt-splash-active .pt-splash{opacity:1;visibility:visible}
</style>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore | PaliTrento</title>
<meta name="description" content="Tara, Palit Ta sa Trento! Find local stores, products and services in Trento, Agusan del Sur.">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="pt-splash" aria-hidden="true">
  <svg class="pt-splash__logo" width="150" height="166" viewBox="35 15 465 515" focusable="false">
    <defs>
      <filter id="pt-outline" filterUnits="userSpaceOnUse" x="0" y="-120" width="540" height="720" color-interpolation-filters="sRGB">
        <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="grow"/>
        <feFlood flood-color="#ffffff"/>
        <feComposite in2="grow" operator="in" result="white"/>
        <feMerge><feMergeNode in="white"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g filter="url(#pt-outline)">
      <ellipse class="pt-splash__base" cx="267.5" cy="490" rx="82" ry="22" fill="#1f4c47"/>
      <path class="pt-splash__pole" d="M225 150H310V440L267.5 474L225 440Z" fill="#70401a"/>
      <path class="pt-splash__scallop" style="--i:0" d="M55 46Q55 32 69 32H140V150A42.5 42.5 0 0 1 55 150Z" fill="#1e4b46"/>
      <path class="pt-splash__scallop" style="--i:1" d="M140 32H225V150A42.5 42.5 0 0 1 140 150Z" fill="#fdc147"/>
      <path class="pt-splash__scallop" style="--i:2" d="M225 32H310V150A42.5 42.5 0 0 1 225 150Z" fill="#1e4b46"/>
      <path class="pt-splash__scallop" style="--i:3" d="M310 32H395V150A42.5 42.5 0 0 1 310 150Z" fill="#fdc147"/>
      <path class="pt-splash__scallop" style="--i:4" d="M395 32H466Q480 32 480 46V150A42.5 42.5 0 0 1 395 150Z" fill="#1e4b46"/>
    </g>
  </svg>
  <p class="pt-splash__word">PaliTrento</p>
  <p class="pt-splash__tag">Tara, Palit Ta sa Trento!</p>
</div>
<div id="chrome-top"></div>
<main class="explore-page">
<section><div class="wrap">
  <h1 style="font-size:clamp(2rem,4vw,2.6rem);margin-bottom:20px">Explore Trento</h1>
  <form id="f" class="filters" role="search">
    <div><label for="q">Search stores or products</label><input id="q" type="search" placeholder="e.g. bigas, gamot, saging"></div>
    <div><label for="cat">Category</label><select id="cat"><option value="">All categories</option></select></div>
    <div><label for="brgy">Barangay</label><select id="brgy"><option value="">All 16 barangays</option></select></div>
  </form>
  <div class="checks"><label><input type="checkbox" id="open"> Open now</label><label><input type="checkbox" id="ver"> Verified only</label></div>
</div></section>
<section id="explore-featured-stores-section" class="catalog-featured-section" aria-labelledby="explore-featured-stores-title" data-featured-section>
  <div class="wrap">
    <div class="sec-head">
      <div>
        <h2 id="explore-featured-stores-title">Featured Stores</h2>
        <p class="muted featured-stores-description">Premium and promoted stores in Trento.</p>
      </div>
    </div>
  </div>
  <div class="featured-products-carousel featured-stores-carousel" data-featured-carousel role="region" aria-roledescription="carousel" aria-label="Featured stores">
    <div class="featured-products-viewport">
      <div id="explore-featured-stores" class="featured-products-grid"></div>
    </div>
    <div class="featured-stores-controls" data-featured-controls hidden>
      <span data-featured-status aria-live="off"></span>
      <button type="button" class="btn alt" data-featured-toggle aria-label="Pause carousel">Pause</button>
    </div>
  </div>
</section>
<section><div class="wrap">
  <p class="muted" id="count" role="status"></p>
  <div class="grid" id="results"></div>
</div></section></main>
<div id="chrome-foot"></div>
<script type="module" src="/js/explore.js"></script>
</body>
</html>
