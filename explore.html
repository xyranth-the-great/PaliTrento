<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Explore | PaliTrento</title>
<meta name="description" content="Tara, Palit Ta sa Trento! Find local stores, products and services in Trento, Agusan del Sur.">
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="chrome-top"></div>
<main><section><div class="wrap">
  <h1 style="font-size:clamp(2rem,4vw,2.6rem);margin-bottom:20px">Explore Trento</h1>
  <form id="f" class="filters" role="search">
    <div><label for="q">Search stores or products</label><input id="q" type="search" placeholder="e.g. bigas, gamot, saging"></div>
    <div><label for="cat">Category</label><select id="cat"><option value="">All categories</option></select></div>
    <div><label for="brgy">Barangay</label><select id="brgy"><option value="">All 16 barangays</option></select></div>
  </form>
  <div class="checks"><label><input type="checkbox" id="open"> Open now</label><label><input type="checkbox" id="ver"> LGU verified only</label></div>
  <p class="muted" id="count" role="status"></p>
  <div class="grid" id="results"></div>
</div></section></main>
<div id="chrome-foot"></div>
<script type="module" src="js/explore.js"></script>
</body>
</html>
