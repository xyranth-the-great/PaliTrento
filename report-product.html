<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report Product | PaliTrento</title>
<meta name="description" content="Report a product for review by administrators.">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  .report-page { max-width: 640px; margin: 0 auto; padding: var(--pad); }
  .report-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 32px; }
  .report-header { margin-bottom: 24px; text-align: center; }
  .report-header h1 { margin: 0 0 8px; }
  .report-header p { color: var(--muted); }
  .product-info { background: var(--muted-bg); border-radius: var(--r-lg); padding: 16px; margin-bottom: 24px; display: flex; gap: 12px; align-items: center; }
  .product-info img { width: 60px; height: 60px; object-fit: cover; border-radius: var(--r-md); background: var(--line); }
  .product-info .text h3 { margin: 0 0 4px; font-size: 1rem; }
  .product-info .text p { margin: 0; color: var(--muted); font-size: 0.85rem; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; }
  .form-group select, .form-group textarea { width: 100%; padding: 11px 12px; border: 1px solid #8a948d; border-radius: var(--r-md); background: #fff; font: inherit; }
  .form-group textarea { min-height: 120px; resize: vertical; }
  .form-group .hint { font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
  .required { color: var(--bad); }
  .btn-submit { width: 100%; padding: 14px; font-size: 1rem; }
  .back-link { display: inline-block; margin-top: 16px; color: var(--primary); text-decoration: underline; }
</style>
</head>
<body>
<div id="chrome-top"></div>
<main class="report-page">
  <div class="report-card">
    <div class="report-header">
      <h1>Report Product</h1>
      <p>Help keep PaliTrento safe by reporting inappropriate or fraudulent product listings.</p>
    </div>

    <div class="product-info" id="product-info">
      <div style="width:60px;height:60px;border-radius:var(--r-md);background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.75rem">Loading</div>
      <div class="text">
        <h3>Loading...</h3>
        <p></p>
      </div>
    </div>

    <form id="report-form" novalidate>
      <div class="form-group">
        <label for="reason">Reason <span class="required">*</span></label>
        <select id="reason" name="reason" required>
          <option value="">Select a reason</option>
          <option value="INAPPROPRIATE_PRODUCT">Inappropriate product</option>
          <option value="PROHIBITED_PRODUCT">Prohibited or illegal product</option>
          <option value="MISLEADING_DESCRIPTION">Misleading product description</option>
          <option value="FRAUDULENT_LISTING">Fake or fraudulent listing</option>
          <option value="INCORRECT_PRICING">Incorrect pricing or information</option>
          <option value="COPYRIGHT_CONCERN">Copyright or intellectual property concern</option>
          <option value="OTHER">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Additional Details <span class="required">*</span></label>
        <textarea id="description" name="description" required placeholder="Please provide as much detail as possible to help us investigate..."></textarea>
        <p class="hint">Include specific examples, what you observed, or any evidence you have.</p>
      </div>

      <button type="submit" class="btn btn-submit" id="submit-btn">Submit Report</button>
    </form>

    <a href="#" id="back-link" class="back-link">← Back to product page</a>
  </div>
</main>
<div id="chrome-foot"></div>
<script type="module">
import { renderChrome, $, esc } from './js/ui.js';
import { getSessionWithStatus, checkAuthErrorParams } from './js/auth.js';
import { supabase } from './js/supabase.js';
import { isSupabaseConfigured } from './js/auth.js';

const form = $('#report-form');
const submitBtn = $('#submit-btn');
const productInfo = $('#product-info');
const backLink = $('#back-link');

let productId = null;
let productData = null;

async function init() {
  const urlParams = new URLSearchParams(window.location.search);
  productId = urlParams.get('productId');

  if (!productId) {
    showError('No product specified');
    return;
  }

  // Check for auth error params from Supabase redirect
  const authErrorRedirect = checkAuthErrorParams();
  if (authErrorRedirect) {
    window.location.replace(authErrorRedirect);
    return;
  }

  const { session, profile, redirectUrl } = await getSessionWithStatus();
  if (redirectUrl) {
    window.location.replace(redirectUrl);
    return;
  }
  if (!session) {
    window.location.href = '/login/';
    return;
  }

  renderChrome('/report-product/', session, profile);

  // Load product info
  await loadProduct();

  form.addEventListener('submit', handleSubmit);
}

async function loadProduct() {
  try {
    const { data: product, error } = await supabase
      .from('products')
      .select('name, current_price, unit, image_url, store_id, stores(business_name, trn_code)')
      .eq('id', productId)
      .maybeSingle();

    if (error || !product) {
      showError('Product not found');
      return;
    }

    productData = product;
    const store = product.stores;

    productInfo.innerHTML = `
      ${product.image_url ? `<img src="${esc(product.image_url)}" alt="${esc(product.name)}">` : `<div style="width:60px;height:60px;border-radius:var(--r-md);background:var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.75rem">No image</div>`}
      <div class="text">
        <h3>${esc(product.name)}</h3>
        <p>${esc(product.current_price)} / ${product.unit} · ${esc(store?.business_name || 'Unknown Store')}</p>
      </div>
    `;

    backLink.href = `/product-detail/?id=${encodeURIComponent(productId)}`;
    backLink.textContent = `← Back to ${esc(product.name)}`;
  } catch (err) {
    console.error('Load product error:', err);
    showError('Failed to load product');
  }
}

async function handleSubmit(e) {
  e.preventDefault();

  const reason = form.reason.value;
  const description = form.description.value.trim();

  if (!reason) {
    showError('Please select a reason');
    return;
  }

  if (!description) {
    showError('Please provide additional details');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'Submitting...';

  try {
    const { data, error } = await supabase.rpc('create_product_report', {
      p_product_id: productId,
      p_reason: reason,
      p_description: description
    });

    if (error) throw error;

    // Success
    document.body.innerHTML = `
      <div class="report-card" style="text-align:center">
        <div class="report-header">
          <div style="width:64px;height:64px;margin:0 auto 16px;background:var(--ok-bg);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ok)">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </div>
          <h1>Report Submitted</h1>
          <p>Thank you for reporting this product. Our administrators will review your report.</p>
        </div>
        <p class="muted" style="margin-top:24px">Report ID: <code>${data.report_id}</code></p>
        <a href="/product-detail/?id=${encodeURIComponent(productId)}" class="btn" style="margin-top:16px;display:inline-block">Return to Product</a>
      </div>
    `;
  } catch (err) {
    console.error('Submit report error:', err);
    showError(err.message || 'Failed to submit report. Please try again.');
    submitBtn.disabled = false;
    submitBtn.textContent = 'Submit Report';
  }
}

function showError(message) {
  productInfo.innerHTML = `<p class="pill bad" style="text-align:center">${esc(message)}</p>`;
}

init();
</script>
</body>
</html>
