<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat | PaliTrento</title>
<meta name="description" content="Chat with buyer/seller about your order.">
<link rel="icon" type="image/png" href="./assets/logo-DrGexIuc.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
  <script type="module" crossorigin src="./assets/chat-CrRDeZOP.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/auth-CUXxddii.js">
  <link rel="modulepreload" crossorigin href="./assets/ui-C7Le0FRc.js">
  <link rel="stylesheet" crossorigin href="./assets/auth-DEjNCzV-.css">
</head>
<body>
<div id="chrome-top"></div>
<main>
<div class="wrap" style="max-width:720px;padding-top:24px;padding-bottom:48px">
  <!-- Back link -->
  <a href="dashboard.html" class="muted" style="display:inline-block;margin-bottom:16px;text-decoration:none">&larr; Back to dashboard</a>

  <div id="chat-container" style="display:none;flex-direction:column;height:calc(100vh - 200px);min-height:500px">
    <!-- Header -->
    <div style="display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line);background:var(--card)">
      <a href="#" id="chat-back-link" style="color:var(--primary);text-decoration:none;font-weight:600">&larr; Back</a>
      <div style="flex:1">
        <h2 id="chat-title" style="margin:0;font-size:1.1rem"></h2>
        <p class="muted" id="chat-subtitle" style="margin:0;font-size:.8rem"></p>
      </div>
      <span class="pill ok" id="chat-status" style="font-size:.7rem">Online</span>
    </div>

    <!-- Messages -->
    <div id="messages-list" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px"></div>

    <!-- Input -->
    <form id="message-form" style="padding:16px;border-top:1px solid var(--line);background:var(--card);display:flex;gap:8px">
      <input type="text" id="message-input" name="content" placeholder="Type a message..." required style="flex:1;padding:12px 16px;border:1px solid var(--line);border-radius:999px;font:inherit;min-width:0">
      <button type="submit" class="btn" style="width:auto;min-width:80px;padding:12px 20px">Send</button>
    </form>
  </div>

  <!-- Loading/Error -->
  <p class="muted" id="loading-msg" style="text-align:center;padding:48px">Loading chat...</p>
  <p class="muted" id="error-msg" style="display:none;text-align:center;padding:48px;color:var(--bad)"></p>
</div>
</main>
<div id="chrome-foot"></div>
</body>
</html>
