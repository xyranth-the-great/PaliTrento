<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Details | PaliTrento</title>
<meta name="description" content="View product details and reserve for pickup.">
<link rel="icon" type="image/png" href="./assets/logo-DrGexIuc.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <script type="module" crossorigin src="./assets/product-detail-Dlmjb7hn.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/auth-CUXxddii.js">
  <link rel="modulepreload" crossorigin href="./assets/ui-C7Le0FRc.js">
  <link rel="stylesheet" crossorigin href="./assets/auth-DEjNCzV-.css">
</head>
<body>
<div id="chrome-top"></div>
<main>
<div class="wrap" style="max-width:800px;padding-top:24px;padding-bottom:48px">
  <!-- Back link -->
  <a href="products.html" class="muted" style="display:inline-block;margin-bottom:16px;text-decoration:none">&larr; Back to products</a>

  <div id="product-content" style="display:none">
    <!-- Product header -->
    <div style="display:grid;grid-template-columns:1fr 280px;gap:24px;margin-bottom:24px">
      <div>
        <h1 id="p-name" style="margin:0 0 8px"></h1>
        <p class="muted" id="p-category"></p>
      </div>
      <div style="text-align:right">
        <div class="price" id="p-price" style="font-size:2rem"></div>
        <div id="p-srp-badge" style="margin-top:8px"></div>
      </div>
    </div>

    <!-- Stock & Store info -->
    <div class="card" style="padding:20px;margin-bottom:24px;display:grid;grid-template-columns:1fr 1fr;gap:24px">
      <div>
        <h3 style="margin:0 0 12px">Availability</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:.9rem">
          <div><span class="muted">Stock:</span> <strong id="p-stock">—</strong></div>
          <div><span class="muted">Unit:</span> <strong id="p-unit">—</strong></div>
          <div><span class="muted">Qty available:</span> <strong id="p-quantity">—</strong></div>
        </div>
      </div>
      <div>
        <h3 style="margin:0 0 12px">Store</h3>
        <div id="store-info">
          <p style="margin:0 0 4px;font-weight:600" id="store-name">—</p>
          <p class="muted" style="margin:0 0 8px;font-size:.9rem" id="store-location">—</p>
          <p class="muted" style="margin:0 0 8px;font-size:.85rem" id="store-hours">—</p>
          <div id="store-badges"></div>
        </div>
        <a id="store-link" href="#" class="btn alt" style="margin-top:12px;width:100%;text-align:center;font-size:.9rem">View store</a>
      </div>
    </div>

    <!-- Map -->
    <div class="card" style="padding:20px;margin-bottom:24px">
      <h3 style="margin:0 0 12px">Location</h3>
      <div id="map" style="height:250px;border-radius:var(--r-lg);border:1px solid var(--line)"></div>
      <p class="muted" style="font-size:.8rem;margin-top:8px" id="store-landmark"></p>
    </div>

    <!-- Reserve form -->
    <div class="card" style="padding:20px;background:var(--amber-light);border-color:var(--amber)">
      <h3 style="margin:0 0 16px">Reserve for Pickup</h3>
      <p class="muted" style="margin-bottom:16px">Enter quantity and choose payment method. Pay at the store when you pick up.</p>

      <form id="reserve-form" novalidate style="display:grid;gap:16px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div>
            <label for="qty">Quantity <span class="bad">*</span></label>
            <input id="qty" name="quantity" type="number" min="1" step="1" required value="1" style="width:100%">
            <p class="muted" style="font-size:.8rem;margin-top:4px">Available: <span id="max-qty">—</span></p>
          </div>
          <div>
            <label for="payment">Payment method <span class="bad">*</span></label>
            <select id="payment" name="payment_method" required>
              <option value="CASH">Cash</option>
              <option value="GCASH">GCash</option>
              <option value="TRIKE_COD">Trike COD</option>
            </select>
          </div>
        </div>

        <div>
          <label for="notes">Notes (optional)</label>
          <textarea id="notes" name="notes" rows="2" placeholder="e.g., Will pick up tomorrow morning"></textarea>
        </div>

        <div style="display:flex;gap:12px;justify-content:flex-end">
          <div style="font-size:1.2rem;font-weight:800;color:var(--primary-dark);align-self:center">
            Total: <span id="total-price">₱0</span>
          </div>
          <button type="submit" class="btn" style="min-width:180px">Reserve for Pickup</button>
        </div>
      </form>

      <p id="reserve-msg" class="muted" style="margin-top:12px;min-height:1.5em"></p>
    </div>
  </div>

  <!-- Loading / Error -->
  <p class="muted" id="loading-msg" style="text-align:center;padding:48px">Loading product...</p>
  <p class="muted" id="error-msg" style="display:none;text-align:center;padding:48px;color:var(--bad)"></p>
</div>
</main>
<div id="chrome-foot"></div>
</body>
</html>
