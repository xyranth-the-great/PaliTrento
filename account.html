<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Account | PaliTrento</title>
<meta name="description" content="Your PaliTrento account dashboard.">
<link rel="icon" type="image/png" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="chrome-top"></div>
<main>
<div class="wrap" style="max-width:600px;padding-top:48px;padding-bottom:48px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px">
    <h1 style="margin:0">My account</h1>
    <span class="pill info" id="account-role-badge" style="font-size:.8rem"></span>
  </div>

  <div id="account-content" style="margin-top:24px;display:none">
    <!-- PROFILE TAB -->
    <div id="tab-profile" role="tabpanel" style="display:block">
      <!-- Avatar section -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:8px">
        <div id="avatar-preview" style="width:96px;height:96px;border-radius:50%;background:var(--primary-dark);color:var(--amber);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative">
          <svg id="avatar-placeholder" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:block"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <img id="avatar-img" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:none">
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
          <label class="btn" style="font-size:.9rem;padding:8px 14px;cursor:pointer">
            Change photo
            <input id="avatar-input" type="file" accept="image/jpeg,image/png,image/webp" style="display:none">
          </label>
          <button id="avatar-remove" type="button" class="btn alt" style="font-size:.9rem;padding:8px 14px;display:none">Remove photo</button>
        </div>
        <p id="avatar-msg" class="muted" style="font-size:.85rem;text-align:center;min-height:1.2em"></p>
      </div>

      <form id="account-form" novalidate style="display:grid;gap:16px">
        <div>
          <label for="acc-name">Full name</label>
          <input id="acc-name" name="full_name" type="text" autocomplete="name" required>
        </div>

        <div>
          <label for="acc-email">Email</label>
          <input id="acc-email" name="email" type="email" readonly style="background:var(--muted-bg);cursor:not-allowed">
        </div>

        <div>
          <label for="acc-role">Role</label>
          <input id="acc-role" name="role" type="text" readonly style="background:var(--muted-bg);cursor:not-allowed">
        </div>

        <div>
          <label for="acc-barangay">Barangay</label>
          <select id="acc-barangay" name="barangay">
            <option value="">Choose your barangay</option>
          </select>
        </div>

        <button type="submit" id="save-btn" class="btn" style="width:100%">Save changes</button>
      </form>

      <button id="logout-btn" class="btn alt" style="margin-top:24px;width:100%">Log out</button>
    </div>

  <p id="account-message" class="muted" style="margin-top:16px;min-height:1.5em;display:none"></p>
</div>
</main>
<div id="chrome-foot"></div>
<script type="module" src="/js/account.js"></script>
</body>
</html>
